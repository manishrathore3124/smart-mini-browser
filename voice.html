<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Voice Command</title>
  <style>
    body {
      background: #1e1e2e;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h2 { margin-bottom: 20px; }
    #status {
      font-size: 18px;
      margin-bottom: 20px;
      color: #aaa;
    }
    #mic { font-size: 60px; margin-bottom: 10px; animation: pulse 1s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="mic">🎤</div>
  <h2>Voice Command</h2>
  <div id="status">🔴 Listening...</div>
</body>
</html>
